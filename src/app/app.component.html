<div class="w-full min-h-screen grid place-items-center p-4">
  <div class="flex flex-col gap-4 p-5 bg-zinc-800 rounded-2xl w-full max-w-lg">
    <h1
      class="text-5xl leading-tight font-black from-pink-400 via-purple-500 to-indigo-600 bg-gradient-to-tr inline-block self-center bg-clip-text text-transparent"
    >
      {{ title }}
    </h1>
    <form
      class="flex flex-col gap-2"
      (submit)="addItem($event, newTodo.value); newTodo.value = ''"
    >
      <label for="addTodo" class="text-center text-zinc-500">
        What would you like to do?
      </label>
      <div class="input">
        <input #newTodo type="text" placeholder="Add a todo..." id="addTodo" />
        <div class="gr"></div>
        <button>+</button>
      </div>
    </form>
    <div class="my-1 flex items-center gap-4 justify-evenly filters">
      <button
        (click)="setFilterValue('all')"
        [class]="{ active: filter === 'all' }"
      >
        All
      </button>
      <button
        (click)="setFilterValue('active')"
        [class]="{ active: filter === 'active' }"
      >
        Active
      </button>
      <button
        (click)="setFilterValue('done')"
        [class]="{ active: filter === 'done' }"
      >
        Done
      </button>
    </div>
    @if (todoItems.length) {
    <div class="flex flex-col gap-2">
      @for(todo of todoItems; track todo.title) {
      <app-item (remove)="removeItem(todo)" [item]="todo"></app-item>
      }
    </div>
    } @else {
    <div class="p-4 text-3xl font-semibold text-center opacity-30">
      no todos yet...
    </div>
    }
  </div>
</div>
